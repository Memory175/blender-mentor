# Opt-in Blender Mentor filesystem Skill provider for DeepSeek Harness.
# Resolves the packaged Skill root from the installed package identity.
- insert:
    - id: blender-mentor-skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: blender-mentor-plugin
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('blender-mentor/package.json')), 'skills')
